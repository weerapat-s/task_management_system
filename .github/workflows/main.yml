# .github/workflows/main.yml
name: Python CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install -r requirements.txt   # เปิดใช้เมื่อมีไฟล์ requirements.txt
          pip install flake8 black            # ติดตั้ง linter/formatter

      - name: Run Linters (Code Quality Check)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # black --check .   # เปิดใช้เมื่อต้องการบังคับ format ด้วย black

      - name: Run Tests (Conceptual - no actual tests yet)
        run: |
          echo "Running conceptual tests..."
          # python -m unittest discover   # เปิดใช้เมื่อเขียน Unit Tests แล้ว
          # pytest
          echo "All checks passed!"

      - name: Display success message
        run: echo "CI/CD Pipeline finished successfully!"
